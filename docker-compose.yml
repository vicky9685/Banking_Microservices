services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  vault:
    image: hashicorp/vault:1.18
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 5s
      retries: 20

  # One-shot seed of policies + secrets. Idempotent.
  vault-bootstrap:
    image: hashicorp/vault:1.18
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -e
        vault secrets enable -path=secret -version=2 kv 2>/dev/null || true

        vault kv put secret/banking/common \
          jwt.signing-key="dev-only-jwt-signing-key-please-rotate-32chars-minimum"

        for svc_db in auth-service:authdb customer-service:customerdb \
                      account-service:accountdb transaction-service:transactiondb \
                      workflow-service:workflowdb; do
          svc="$${svc_db%%:*}"
          vault kv put secret/banking/$${svc} \
            db.username="postgres" \
            db.password="postgres" \
            solace.username="default" \
            solace.password="default"
        done

        # Camunda admin credentials
        vault kv patch secret/banking/workflow-service \
          camunda.admin.username="admin" \
          camunda.admin.password="admin"

        vault kv put secret/banking/notification-service \
          solace.username="default" \
          solace.password="default"

        vault kv put secret/banking/api-gateway dummy=1
        echo "Vault bootstrap complete."

  solace:
    image: solace/solace-pubsub-standard:latest
    shm_size: 1g
    ulimits:
      core: -1
      memlock: -1
      nofile: { soft: 2448, hard: 6592 }
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      system_scaling_maxconnectioncount: "100"
    ports:
      - "55555:55555"     # SMF (JMS)
      - "8008:8080"       # SEMP / management UI
      - "1883:1883"       # MQTT
      - "8000:8000"       # REST
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u admin:admin http://localhost:8080/SEMP/v2/config/about | grep -q sempVersion || exit 1"]
      interval: 10s
      retries: 30

  config-server:
    build: { context: ., args: { SERVICE: config-server } }
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD","wget","-q","--spider","http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 10

  discovery-server:
    build: { context: ., args: { SERVICE: discovery-server } }
    ports: ["8761:8761"]
    depends_on: { config-server: { condition: service_healthy } }

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    environment: &gateway-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      REDIS_HOST: redis
      VAULT_URI: http://vault:8200
      VAULT_AUTH: TOKEN
      VAULT_TOKEN: root
    depends_on:
      vault-bootstrap: { condition: service_completed_successfully }
      discovery-server: { condition: service_started }
      redis: { condition: service_started }

  auth-service:
    build: { context: ., args: { SERVICE: auth-service } }
    environment: &svc-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_HOST: postgres
      KAFKA_BROKERS: kafka:29092
      VAULT_URI: http://vault:8200
      VAULT_AUTH: TOKEN
      VAULT_TOKEN: root
      REDIS_HOST: redis
      SOLACE_HOST: tcp://solace:55555
      SOLACE_VPN: default
    depends_on:
      postgres: { condition: service_healthy }
      vault-bootstrap: { condition: service_completed_successfully }

  customer-service:
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      <<: *svc-env
      DB_NAME: customerdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      vault-bootstrap: { condition: service_completed_successfully }

  account-service:
    build: { context: ., args: { SERVICE: account-service } }
    environment:
      <<: *svc-env
      DB_NAME: accountdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      vault-bootstrap: { condition: service_completed_successfully }

  transaction-service:
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      <<: *svc-env
      DB_NAME: transactiondb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      solace: { condition: service_healthy }
      vault-bootstrap: { condition: service_completed_successfully }

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment: *svc-env
    depends_on:
      kafka: { condition: service_started }
      solace: { condition: service_healthy }
      vault-bootstrap: { condition: service_completed_successfully }

  workflow-service:
    build: { context: ., args: { SERVICE: workflow-service } }
    ports: ["8087:8087"]
    environment:
      <<: *svc-env
      DB_NAME: workflowdb
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      vault-bootstrap: { condition: service_completed_successfully }

  ui:
    build: { context: ./ui }
    ports: ["3000:80"]
    depends_on: [api-gateway]

volumes:
  pgdata:
