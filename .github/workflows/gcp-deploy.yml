name: Automated GCP Free-Tier Deployment

on:
  push:
    branches:
      - main  # Trigger deployment automatically on push to main branch

permissions:
  contents: read
  id-token: write  # Required for authenticating via Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate securely with GCP using Workload Identity Federation (Recommended)
      # Or fall back to a Service Account Key if preferred.
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Using Workload Identity Federation (Recommended)
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Alternatively, you can use Service Account Keys:
          # credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Execute Overhauled Deployment Script
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JWT_SECRET: ${{ secrets.GCP_JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.GCP_DB_PASSWORD }}
          REGION: us-central1
        run: |
          chmod +x deploy/gcp-deploy.sh
          ./deploy/gcp-deploy.sh
