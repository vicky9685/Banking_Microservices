{{- /*
Static infra secrets — never used for app-level secrets (those live in Vault).
These exist only so the Vault dev token and Solace admin password are present
before the bootstrap Job runs.
*/ -}}
{{- if .Values.vault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: vault-root-token
type: Opaque
stringData:
  token: {{ .Values.vault.server.dev.devRootToken | default "root" | quote }}
---
{{- end }}
{{- if .Values.solace.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.solace.adminPasswordSecret }}
type: Opaque
stringData:
  admin-password: "admin-change-me"
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  postgres-password: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  10-databases.sql: |
    CREATE DATABASE customerdb;
    CREATE DATABASE accountdb;
    CREATE DATABASE transactiondb;
    CREATE DATABASE authdb;
    CREATE DATABASE workflowdb;
{{- end }}
