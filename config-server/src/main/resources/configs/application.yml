# Shared defaults for every service. Override via {service}.yml.
app:
  features:
    # All toggles default ON. Flip via env vars: APP_FEATURES_KAFKA_ENABLED=false etc.
    kafka:     { enabled: ${APP_FEATURES_KAFKA_ENABLED:true} }
    solace:    { enabled: ${APP_FEATURES_SOLACE_ENABLED:true} }
    scheduler: { enabled: ${APP_FEATURES_SCHEDULER_ENABLED:true} }
    camunda:   { enabled: ${APP_FEATURES_CAMUNDA_ENABLED:true} }
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-please-replace-32chars-min}
      expiration-ms: 3600000
      issuer: banking-platform
    service-auth:
      enabled: ${SERVICE_AUTH_ENABLED:true}
      hmac-key: ${service.hmac.key:dev-only-internal-shared-key-please-rotate}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
